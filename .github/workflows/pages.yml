name: Pages

# Publica el sitio estático en GitHub Pages.
#
# Se usa el flujo con artefacto (build_type: workflow) y no la publicación desde
# rama: asi el propio workflow puede habilitar Pages si el repositorio no lo tiene
# todavia (configure-pages con enablement: true), sin depender de un PAT con
# permiso de administracion.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Habilitar / configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
